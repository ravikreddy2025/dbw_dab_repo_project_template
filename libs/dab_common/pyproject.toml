[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dab_common"
# Version is bumped by the release process (see docs/07-release-process.md).
# CI may append a build suffix for dev deploys via `artifacts.dynamic_version`.
version = "0.4.0"
description = "Cross-cutting EDP framework: runtime config, audit, data quality."
requires-python = ">=3.11"
dependencies = []          # Spark, dlt and dbutils are provided by the Databricks runtime.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
