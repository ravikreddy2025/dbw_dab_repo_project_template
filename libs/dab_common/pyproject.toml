[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dab_common"
# Version is bumped by the release process (see docs/07-release-process.md).
# CI may append a build suffix for dev deploys via `artifacts.dynamic_version`.
version = "0.4.0"
description = "Cross-cutting EDP framework: runtime config, audit, data quality."
requires-python = ">=3.11"
# Spark, dlt and dbutils are provided by the Databricks runtime, so they are not
# declared. PyYAML IS declared: environments.py imports it at module level, and
# "the runtime happens to ship it" is a dependency you find out about when a
# runtime upgrade removes it. It is already present on DBR, so this resolves to
# a no-op rather than a download.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

# environments.yml is DATA the wheel must carry: detect_environment() reads it on
# a cluster, where the repo does not exist. Without this the wheel builds fine and
# fails at runtime with a missing file.
[tool.setuptools.package-data]
dab_common = ["environments.yml"]
