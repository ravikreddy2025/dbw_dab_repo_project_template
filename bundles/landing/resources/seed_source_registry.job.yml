# Loads conf/<use_case>/sources.yml into ops.config.landing_source.
#
# This is how source metadata is promoted between environments: the YAML is
# reviewed in a PR, travels through main -> release/* on the same branches as the
# code, and is applied to each environment by this job. Nobody types INSERT
# statements into a workspace SQL editor.
#
# Run automatically by the CD pipeline right after the landing bundle deploys, so
# a metadata change lands with the code that depends on it.

resources:
  jobs:
    landing_seed_source_registry:
      name: landing_seed_source_registry
      description: "MERGE conf/*/sources.yml into ops.config.landing_source for this environment."

      tags:
        use_case: landing
        layer: landing
        managed_by: databricks_bundle
        environment: ${var.env}

      # No schedule: on demand, and automatically by CD after every deploy.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.alert_email}

      parameters:
        - name: env
          default: ${var.env}
        # The seed job spans every use case, so it is not scoped to one. Its
        # audit rows are stamped use_case=landing.
        - name: use_case
          default: landing
        - name: catalog_prefix
          default: ${var.catalog_prefix}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: bundle_target
          default: ${bundle.target}
        # Print the plan without writing. The CD pipeline leaves this false; a
        # developer investigating a diff sets it true.
        - name: dry_run
          default: "false"
        # Restrict the seed to one use case:
        #   databricks bundle run landing_seed_source_registry -t dev --params only_use_case=us1
        - name: only_use_case
          default: ""

      tasks:
        - task_key: seed_source_registry
          notebook_task:
            notebook_path: ../src/jobs/seed_source_registry.py
          environment_key: default
          # The seed is a MERGE from git - idempotent, safe to retry.
          max_retries: ${var.max_retries}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/dab_common-*.whl
              - ./dist/edp_landing-*.whl
              - ./dist/edp_landing_bundle-*.whl
