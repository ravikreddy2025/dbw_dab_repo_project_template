# =============================================================================
# EDP PLATFORM BUNDLE
# -----------------------------------------------------------------------------
# Owns everything SHARED across use cases: the four catalogs per environment,
# every schema in them, volumes, secret scopes, and the ops-catalog DDL
# (audit, config, logs, recon).
#
# THIS BUNDLE DEPLOYS FIRST. The landing bundle and every use-case bundle assume
# the catalogs, schemas and ops tables already exist. Databricks' guidance is to
# model a bundle-to-bundle dependency in the CI/CD layer rather than by merging
# bundles - cd-platform is that dependency, enforced by process and documented
# in docs/07-release-process.md.
#
# Owned by @edp-platform-leads. There is deliberately NO personal `dev` target:
# individual developers never deploy shared catalogs. Their sandbox SCHEMAS are
# created at runtime by dab_common.config.ensure_schema().
# =============================================================================

bundle:
  name: edp_platform
  databricks_cli_version: ">=0.240.0"

include:
  - variables.yml
  - resources/*.yml

targets:

  nonprod:
    mode: production
    default: true
    workspace:
      host: https://adb-0000000000000001.1.azuredatabricks.net   # PLACEHOLDER: nonprod workspace
      root_path: /Workspace/Applications/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    permissions:
      - level: CAN_MANAGE
        group_name: edp-platform-leads
      - level: CAN_VIEW
        group_name: edp-developers
    variables:
      env: nonprod
      run_as_sp: 11111111-1111-1111-1111-111111111111        # PLACEHOLDER
      reader_group: edp-developers
      # In nonprod developers create and drop their own sandbox schemas, so the
      # writer group is the whole team. In preprod and prod only the SP writes.
      writer_group: edp-developers
      alert_email: edp-platform-alerts@example.com

  preprod:
    mode: production
    workspace:
      host: https://adb-0000000000000002.2.azuredatabricks.net   # PLACEHOLDER: preprod workspace
      root_path: /Workspace/Applications/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    permissions:
      - level: CAN_MANAGE
        group_name: edp-platform-leads
      - level: CAN_VIEW
        group_name: edp-qa
    variables:
      env: preprod
      run_as_sp: 22222222-2222-2222-2222-222222222222        # PLACEHOLDER
      reader_group: edp-qa
      writer_group: edp-platform-leads
      alert_email: edp-preprod-alerts@example.com

  prod:
    mode: production
    workspace:
      host: https://adb-0000000000000003.3.azuredatabricks.net   # PLACEHOLDER: prod workspace
      root_path: /Workspace/Applications/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    permissions:
      - level: CAN_MANAGE
        group_name: edp-platform-leads
      - level: CAN_VIEW
        group_name: edp-support
    variables:
      env: prod
      run_as_sp: 33333333-3333-3333-3333-333333333333        # PLACEHOLDER
      reader_group: edp-support
      writer_group: edp-platform-leads
      alert_email: edp-prod-oncall@example.com
