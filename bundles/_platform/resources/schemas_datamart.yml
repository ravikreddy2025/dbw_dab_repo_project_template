# DATAMART CATALOG SCHEMAS - one per use case.
#
# Business-facing marts (gold / semantic). Written by the owning use-case bundle.
#
# WHO CAN WRITE THESE
# Only ${var.run_as_sp} - the identity CI deploys jobs to run as. NOT developers.
# A developer writes to their own sandbox schema (jsmith_us1), which they create
# and own via CREATE_SCHEMA on the catalog. That makes the sandbox prefix a
# boundary the metastore enforces, rather than a naming convention a typo can
# cross. See docs/03-developer-guide.md#reading-shared-data.
#
# WHY THESE ARE DECLARED HERE AND NOT IN THE USE-CASE BUNDLES
# In `mode: development` DABs prefixes resource names with "[dev jsmith] ", which
# is not a legal Unity Catalog schema name - so a use-case bundle that declared a
# schema would break the moment a developer deployed their sandbox. Shared schemas
# are declared once here (this bundle has no development-mode target), and
# per-developer sandbox schemas are created at runtime by
# dab_common.config.ensure_schema(). See docs/08-troubleshooting.md#schema-prefix.

resources:
  schemas:

    datamart_us1:
      name: us1
      catalog_name: ${var.catalog_prefix}_datamart_${var.env}
      comment: "datamart layer for use case us1. Managed by the edp_platform bundle."
      grants:
        - principal: edp-platform-leads
          privileges: [ALL_PRIVILEGES]
        # The ONLY writer. Everyone else reads.
        - principal: ${var.run_as_sp}
          privileges: [USE_SCHEMA, CREATE_TABLE, MODIFY, SELECT]
        # The owning team reads the shared table and writes only their sandbox.
        - principal: ${var.owner_us1}
          privileges: [USE_SCHEMA, SELECT]
        - principal: ${var.reader_group}
          privileges: [USE_SCHEMA, SELECT]
        # Read-only: reconciliation must see what the ETL produced without any
        # ability to change it.
        - principal: ${var.recon_sp}
          privileges: [USE_SCHEMA, SELECT]

    datamart_us2:
