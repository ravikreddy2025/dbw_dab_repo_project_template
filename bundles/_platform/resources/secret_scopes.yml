# Secret scopes backed by Azure Key Vault.
#
# The bundle creates the SCOPE (the pointer to the vault); it never creates the
# SECRETS. Values are written to Key Vault by the platform team out of band and
# are never in git. See docs/06-environments-and-access.md#secrets.
#
# Scope names are IDENTICAL in all three environments; the Key Vault behind them
# differs. So one job config works everywhere, and a preprod job physically
# cannot reach production credentials.

resources:
  secret_scopes:

    edp_oracle:
      name: edp-oracle
      # Expected keys: jdbc-url, username, password
      #   (read by edp_landing.oracle.resolve_connection - used by us2)
      backend_type: AZURE_KEYVAULT
      keyvault_metadata:
        resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-edp-${var.env}/providers/Microsoft.KeyVault/vaults/kv-edp-${var.env}
        dns_name: https://kv-edp-${var.env}.vault.azure.net/
      permissions:
        - level: READ
          group_name: ${var.reader_group}
        - level: MANAGE
          group_name: edp-platform-leads

    edp_kafka:
      name: edp-kafka
      # Expected keys: bootstrap-servers, sasl-connection-string
      #   (read by edp_landing.kafka.resolve_bootstrap - used by us1, us3, us4)
      backend_type: AZURE_KEYVAULT
      keyvault_metadata:
        resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-edp-${var.env}/providers/Microsoft.KeyVault/vaults/kv-edp-${var.env}
        dns_name: https://kv-edp-${var.env}.vault.azure.net/
      permissions:
        - level: READ
          group_name: ${var.reader_group}
        - level: MANAGE
          group_name: edp-platform-leads

    edp_legacy:
      name: edp-legacy
      # Expected keys: cloudera-jdbc-url, username, password
      #   Used ONLY by reconciliation, to read the Cloudera side of a comparison.
      #   Delete this scope once every use case has cut over.
      backend_type: AZURE_KEYVAULT
      keyvault_metadata:
        resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-edp-${var.env}/providers/Microsoft.KeyVault/vaults/kv-edp-${var.env}
        dns_name: https://kv-edp-${var.env}.vault.azure.net/
      permissions:
        - level: READ
          group_name: ${var.reader_group}
        - level: MANAGE
          group_name: edp-platform-leads
