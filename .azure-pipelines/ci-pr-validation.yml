# =============================================================================
# CI - PULL REQUEST VALIDATION
# -----------------------------------------------------------------------------
# The Build Validation policy on `main` and `release/*` points here. It must pass
# before a PR can complete. It NEVER deploys - a PR branch is untrusted code, and
# it does not get a service connection.
#
# It detects which bundles the PR actually touched and validates only those, so a
# one-line change to us4 does not spend four minutes testing us1. A change under
# libs/ touches the shared wheels, so it validates everything.
#
# Wire it up:  Repos > Branches > main > Branch policies > Build Validation
#              (see scripts/setup/Az-DevOps-Bootstrap.ps1)
# =============================================================================

name: ci-pr-$(Date:yyyyMMdd)$(Rev:.r)

# No CI trigger: this runs on pull requests only. Merges to main are handled by
# the cd-* pipelines.
trigger: none

# `pr:` IS DELIBERATELY none, NOT a branch/path filter.
#
# Azure Repos Git does not support YAML PR triggers at all: "For an Azure Repos
# Git repo, you cannot configure a PR trigger in the YAML file. You need to use
# branch policies." A `pr:` block here is silently ignored - which is worse than
# an error, because the path excludes under it look like they work and do not.
# A docs-only PR would still run the full build.
#
# Branch AND path filtering for this pipeline therefore live on the Build
# Validation branch policy (`--branch`, `--path-filter`), applied by
# scripts/setup/Az-DevOps-Bootstrap.ps1. That is the only place they take effect.
pr: none

variables:
  - template: templates/vars/common.yml

stages:
  - stage: Validate
    displayName: "Validate the pull request"
    jobs:
      - job: validate
        displayName: "Lint, test and validate changed bundles"
        pool:
          vmImage: ubuntu-latest
        steps:
          # Full history is needed to diff against the PR target branch.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - template: templates/steps/setup-tooling.yml

          - script: |
              set -euo pipefail
              BRANCH="$(System.PullRequest.TargetBranchName)"
              TARGET="origin/$BRANCH"
              # No --depth here. checkout used fetchDepth: 0, so the clone is
              # complete; fetching with --depth would SHALLOW it and can then
              # break the merge base that "$TARGET...HEAD" needs.
              git fetch origin "$BRANCH"
              echo "--- files changed against $TARGET ---"
              git diff --name-only "$TARGET"...HEAD | tee changed.txt
            displayName: "Determine what this PR changed"

          - script: |
              set -euo pipefail
              # Scope follows the dependency graph, not "libs/ changed".
              #   dab_common      embedded by every bundle      -> validate all
              #   edp_landing     embedded by landing only      -> validate landing
              #   edp_recon       embedded by recon only        -> validate recon
              # Without this split, a QA change to the parity framework would
              # revalidate - and on merge, redeploy - production ETL.
              if grep -qE '^(libs/dab_common/|\.azure-pipelines/|pyproject\.toml)' changed.txt; then
                BUNDLES="_platform landing recon us1 us2 us3 us4 us5"
                echo "universal shared code changed - validating ALL bundles"
              elif grep -qE '^libs/edp_landing/' changed.txt; then
                BUNDLES="landing"
                echo "landing framework changed - validating landing only"
              elif grep -qE '^libs/edp_recon/' changed.txt; then
                BUNDLES="recon"
                echo "parity framework changed - validating recon only"
              else
                BUNDLES=$(grep -oE '^bundles/[^/]+' changed.txt \
                          | sed 's|bundles/||' | sort -u | tr '\n' ' ')
                echo "changed bundles: ${BUNDLES:-<none>}"
              fi
              echo "${BUNDLES}" > bundles.txt
            displayName: "Resolve the set of bundles to validate"

          - script: |
              set -euo pipefail
              ruff check .
            displayName: "Lint (ruff)"

          - script: |
              set -euo pipefail
              pip install -e libs/dab_common -e libs/edp_landing -e libs/edp_recon
              for b in $(cat bundles.txt); do
                [ -f "bundles/$b/pyproject.toml" ] && pip install -e "bundles/$b" || true
              done
              # dab_common is embedded by everything, so it is always tested. The
              # other two are tested when their own bundle is in scope.
              TEST_PATHS="libs/dab_common/tests"
              case " $(cat bundles.txt) " in
                *" landing "*) TEST_PATHS="$TEST_PATHS libs/edp_landing/tests" ;;
              esac
              case " $(cat bundles.txt) " in
                *" recon "*) TEST_PATHS="$TEST_PATHS libs/edp_recon/tests" ;;
              esac
              for b in $(cat bundles.txt); do
                [ -d "bundles/$b/tests" ] && TEST_PATHS="$TEST_PATHS bundles/$b/tests"
              done
              echo "testing: $TEST_PATHS"
              pytest $TEST_PATHS -m "not integration" \
                --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml
            displayName: "Unit tests for the changed bundles"

          - task: PublishTestResults@2
            displayName: "Publish test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/test-results.xml"
              testRunTitle: "PR validation"

          - script: |
              set -euo pipefail
              python scripts/ci/check_bundle_references.py
            displayName: "Cross-reference audit (paths, variables, templates)"

          # Bundle syntax is validated WITHOUT a workspace connection. A PR from
          # a feature branch must not be able to reach a real workspace, so this
          # checks structure and variable resolution offline. Full
          # `bundle validate` against nonprod happens in the Build stage of the
          # cd-* pipeline, after the merge.
          - script: |
              set -euo pipefail
              for b in $(cat bundles.txt); do
                echo "--- bundles/$b ---"
                python scripts/ci/validate_bundle_yaml.py "bundles/$b"
              done
            displayName: "Validate bundle YAML structure"
