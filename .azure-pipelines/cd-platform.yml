# =============================================================================
# CD - PLATFORM BUNDLE (catalogs, schemas, ops tables)
# -----------------------------------------------------------------------------
# THIS PIPELINE IS A PREREQUISITE FOR EVERY OTHER PIPELINE.
#
# It creates the four catalogs per environment, every schema in them, volumes,
# secret scopes and the ops-catalog tables. In a brand-new environment, run this
# to completion BEFORE running cd-landing or any cd-us*.
#
# Databricks guidance is to model a bundle-to-bundle dependency in the CI/CD
# layer rather than by merging bundles - this pipeline is that dependency,
# enforced by process and documented in docs/07-release-process.md.
#
# Promotion model:
#   merge to main       -> Build -> NonProd            (no gate)
#   push to release/*   -> Build -> PreProd (gate: leads) -> Prod (gate: client)
#
# All stages of ONE RUN use the same commit and the same wheels, so what prod
# gets is byte-identical to what QA approved in preprod.
# =============================================================================

name: cd-platform-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - bundles/_platform/*
      # A shared-wheel change must redeploy every bundle that embeds it.
      - libs/*
      - .azure-pipelines/*
    exclude:
      - docs/*
      - "**/*.md"

# PR builds are handled by ci-pr-validation.yml, not here.
pr: none

variables:
  - template: templates/vars/common.yml

stages:

  - template: templates/jobs/build-stage.yml
    parameters:
      bundlePath: bundles/_platform
      serviceConnection: dbx-nonprod-svc-conn
      variableGroup: edp-nonprod

  # -- main -> nonprod, automatic ---------------------------------------------
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployNonProd
      displayName: "Deploy to NonProd (dev workspace)"
      environment: dbx-nonprod
      serviceConnection: dbx-nonprod-svc-conn
      target: nonprod
      bundlePath: bundles/_platform
      variableGroup: edp-nonprod
      dependsOn: [Build]
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      runAfterDeploy: platform_bootstrap_ops

  # -- release/* -> preprod, gated on leads -----------------------------------
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployPreProd
      displayName: "Deploy to PreProd (approval: leads)"
      environment: dbx-preprod
      serviceConnection: dbx-preprod-svc-conn
      target: preprod
      bundlePath: bundles/_platform
      variableGroup: edp-preprod
      dependsOn: [Build]
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      runAfterDeploy: platform_bootstrap_ops

  # -- release/* -> prod, gated on the client ---------------------------------
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployProd
      displayName: "Deploy to Prod (approval: client)"
      environment: dbx-prod
      serviceConnection: dbx-prod-svc-conn
      target: prod
      bundlePath: bundles/_platform
      variableGroup: edp-prod
      # Depends on PreProd, not Build: prod can only ever deploy something that
      # already reached preprod and passed its gate.
      dependsOn: [DeployPreProd]
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      runAfterDeploy: platform_bootstrap_ops
