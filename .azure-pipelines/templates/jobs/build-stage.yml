# The Build stage: lint, test, build wheels, validate the bundle config.
#
# Runs on every trigger regardless of branch. Nothing deploys until this is
# green, and the wheels it publishes are what every later stage installs.

parameters:
  - name: bundlePath
    type: string
  - name: serviceConnection
    type: string          # nonprod connection - used only for `bundle validate`
  - name: variableGroup
    type: string

stages:
  - stage: Build
    displayName: "Build, test and validate"
    variables:
      - group: ${{ parameters.variableGroup }}
      - template: ../vars/common.yml
    jobs:
      - job: build
        displayName: "Quality gates + wheels"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - template: ../steps/setup-tooling.yml

          - template: ../steps/quality-gates.yml
            parameters:
              bundlePath: ${{ parameters.bundlePath }}

          - template: ../steps/build-wheels.yml
            parameters:
              bundlePath: ${{ parameters.bundlePath }}

          # Validate against the nonprod workspace. This resolves lookups and
          # variable references for real, catching a broken bundle before any
          # environment is touched.
          - task: AzureCLI@2
            displayName: "Validate bundle configuration"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: ${{ parameters.bundlePath }}
              inlineScript: |
                set -euo pipefail
                databricks bundle validate --target nonprod
