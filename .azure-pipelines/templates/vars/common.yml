# Values shared by every pipeline. Changing one thing here changes it everywhere,
# which is the point - four pipelines drifting apart is how "it works on
# ingestion but not on curation" starts.

variables:
  # Pin the CLI to an EXACT released version. This must be a real tag of
  # github.com/databricks/cli, because setup-tooling.yml downloads
  #   .../releases/download/v<this>/databricks_cli_<this>_linux_amd64.zip
  # and then asserts the installed binary reports it. A typo fails the build in
  # the first step rather than somewhere inside a deploy.
  #
  # Must also satisfy `bundle.databricks_cli_version` in every
  # bundles/*/databricks.yml, or a laptop and the agent will disagree.
  # check_bundle_references.py enforces both halves.
  #
  # NOTE ON 1.x: from CLI 1.3.0 new bundles use the DIRECT deployment engine
  # instead of Terraform. Greenfield is the right time to be on it. If you ever
  # point these bundles at a workspace where an older CLI already deployed them,
  # run `databricks bundle deployment migrate` first. See docs/08.
  DATABRICKS_CLI_VERSION: "1.14.1"

  PYTHON_VERSION: "3.11"

  # Azure AD application ID scope for Databricks. This GUID is the same for every
  # Azure Databricks tenant in the world - it is the resource being requested,
  # not a secret. Only needed by the SP-secret fallback in bundle-deploy.yml.
  DATABRICKS_RESOURCE_ID: "2ff814a6-3304-4ab8-85cb-cd0e6f879c1d"

  # Where the built wheels are published between stages so preprod and prod
  # install the exact binary that was validated in Build.
  WHEEL_ARTIFACT_NAME: "wheels"
