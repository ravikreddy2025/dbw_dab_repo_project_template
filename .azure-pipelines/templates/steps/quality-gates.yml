# Lint and unit tests. Runs once, in the Build stage, before anything deploys.
# If this is red the pipeline stops here.

parameters:
  - name: bundlePath
    type: string
  - name: sharedLibs
    type: string
    default: "dab_common"

steps:
  - script: |
      set -euo pipefail
      ruff check .
    displayName: "Lint (ruff)"

  - script: |
      set -euo pipefail
      for lib in ${{ parameters.sharedLibs }}; do
        pip install -e "libs/$lib"
      done
      # Bundles without a wheel of their own (_platform, recon) have no
      # pyproject.toml - there is nothing to install.
      if [ -f "${{ parameters.bundlePath }}/pyproject.toml" ]; then
        pip install -e "${{ parameters.bundlePath }}"
      fi
    displayName: "Install packages under test"

  - script: |
      set -euo pipefail
      # The shared libraries this bundle depends on are tested on EVERY build of
      # it, because it embeds them. A dab_common regression must not reach a use
      # case, and an edp_recon regression must not reach the cutover evidence.
      TEST_PATHS=""
      COV_ARGS=""
      for lib in ${{ parameters.sharedLibs }}; do
        TEST_PATHS="$TEST_PATHS libs/$lib/tests"
        COV_ARGS="$COV_ARGS --cov=$lib"
      done
      if [ -d "${{ parameters.bundlePath }}/tests" ]; then
        TEST_PATHS="$TEST_PATHS ${{ parameters.bundlePath }}/tests"
      fi
      echo "testing:$TEST_PATHS"
      # -m "not integration" skips the Spark-backed tests: the agent has no
      # cluster and no Java. Those run on a developer machine before the PR.
      pytest $TEST_PATHS \
        -m "not integration" \
        --junitxml=$(Build.ArtifactStagingDirectory)/test-results.xml \
        $COV_ARGS --cov-report=xml:$(Build.ArtifactStagingDirectory)/coverage.xml
    displayName: "Unit tests (pytest)"

  - task: PublishTestResults@2
    displayName: "Publish test results"
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: "$(Build.ArtifactStagingDirectory)/test-results.xml"
      testRunTitle: "Unit tests - ${{ parameters.bundlePath }}"
