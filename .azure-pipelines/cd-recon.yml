# =============================================================================
# CD - RECON BUNDLE (Cloudera parity).  OWNED BY QA.
# -----------------------------------------------------------------------------
# SEPARATE FROM THE USE-CASE PIPELINES ON PURPOSE.
#
# A QA change to a tolerance, a check, or a whole use case parity definition
# deploys through THIS pipeline and only this one. It never rebuilds or
# redeploys a production ETL job. Before recon was extracted into its own
# bundle, editing a tolerance triggered cd-us1 and redeployed the us1 curated
# and datamart jobs - which is not something a validation change should be able
# to do.
#
# The reverse also holds: a use-case team shipping an ETL change does not
# redeploy the checks that are validating them.
#
# Note the trigger paths: libs/edp_recon only. A change to libs/edp_landing or a
# use-case bundle does NOT rebuild recon.
#
# AT DECOMMISSION this file, bundles/recon and libs/edp_recon are deleted in one
# PR, and that PR touches no production ETL at all. See docs/13.
# =============================================================================

name: cd-recon-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - bundles/recon/*
      - libs/edp_recon/*
      - libs/dab_common/*
      - .azure-pipelines/*
    exclude:
      - docs/*
      - "**/*.md"

pr: none

variables:
  - template: templates/vars/common.yml

stages:

  - template: templates/jobs/build-stage.yml
    parameters:
      bundlePath: bundles/recon
      serviceConnection: dbx-nonprod-svc-conn
      variableGroup: edp-nonprod
      sharedLibs: "dab_common edp_recon"

  # -- main -> nonprod, automatic ---------------------------------------------
  # Nonprod is where QA proves a parity CONFIG is right before it starts gating a
  # release. The smoke run reconciles us1, which exercises config loading, the
  # ETL gate and both result tables.
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployNonProd
      displayName: "Deploy recon to NonProd"
      environment: dbx-nonprod
      serviceConnection: dbx-nonprod-svc-conn
      target: nonprod
      bundlePath: bundles/recon
      variableGroup: edp-nonprod
      dependsOn: [Build]
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      runAfterDeploy: recon_us1

  # -- release/* -> preprod, gated on leads -----------------------------------
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployPreProd
      displayName: "Deploy recon to PreProd (approval: leads)"
      environment: dbx-preprod
      serviceConnection: dbx-preprod-svc-conn
      target: preprod
      bundlePath: bundles/recon
      variableGroup: edp-preprod
      dependsOn: [Build]
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      runAfterDeploy: recon_us1

  # -- release/* -> prod, gated on the client ---------------------------------
  # Recon runs in PRODUCTION during the parallel run - that is where parity is
  # proven at real volume - so it goes through the same client gate as anything
  # else that lands in prod.
  - template: templates/jobs/deploy-stage.yml
    parameters:
      stageName: DeployProd
      displayName: "Deploy recon to Prod (approval: client)"
      environment: dbx-prod
      serviceConnection: dbx-prod-svc-conn
      target: prod
      bundlePath: bundles/recon
      variableGroup: edp-prod
      dependsOn: [DeployPreProd]
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
      runAfterDeploy: recon_us1
